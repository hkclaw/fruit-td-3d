<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>水果塔防傳奇 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0a0a1a;
    font-family: "Microsoft JhengHei", "PingFang TC", "Heiti TC", sans-serif;
    color: #fff; user-select: none; -webkit-user-select: none;
  }
  canvas#c { display: block; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; }

  .hud-panel {
    background: rgba(20, 25, 45, 0.45);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 14px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  }

  #topHud {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; padding: 10px 18px; z-index: 50;
  }
  .stat-box {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 10px;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.1);
    font-weight: 700; font-size: 15px;
  }
  .stat-box i { font-size: 16px; }
  #money i { color: #ffd54a; }
  #lives i { color: #ff5a6e; }
  #wave i  { color: #5ec8ff; }

  #controlsHud {
    position: fixed; top: 14px; right: 14px;
    display: flex; flex-direction: column; gap: 8px; z-index: 50;
  }
  .ctrl-btn {
    width: 46px; height: 46px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 16px;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .ctrl-btn:hover { transform: scale(1.08); background: rgba(255,255,255,0.18); }
  .ctrl-btn:active { transform: scale(0.95); }

  #towerBar {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; padding: 10px 14px;
    max-width: 96vw; overflow-x: auto; overflow-y: hidden;
    z-index: 50; scrollbar-width: thin;
  }
  #towerBar::-webkit-scrollbar { height: 6px; }
  #towerBar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 3px; }
  .tower-card {
    flex: 0 0 auto; min-width: 86px;
    padding: 8px 6px; border-radius: 10px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    text-align: center; cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .tower-card:hover { transform: translateY(-4px); background: rgba(255,255,255,0.12); }
  .tower-card.selected { border-color: #ffd54a; background: rgba(255, 213, 74, 0.15); }
  .tower-card .icon { font-size: 26px; display: block; margin-bottom: 2px; }
  .tower-card .name { font-size: 12px; font-weight: 600; }
  .tower-card .cost { font-size: 11px; color: #ffd54a; }

  #upgradePanel {
    position: fixed; right: 14px; top: 50%; transform: translateY(-50%);
    width: 220px; padding: 14px; z-index: 60;
    display: none;
  }
  #upgradePanel.show { display: block; }
  #upgradePanel h3 { margin: 0 0 10px 0; font-size: 15px; text-align: center; }
  .upg-btn {
    width: 100%; padding: 8px 10px; margin-bottom: 8px;
    border-radius: 8px; background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff; cursor: pointer; text-align: left;
    font-size: 13px; transition: background 0.15s ease;
  }
  .upg-btn:hover { background: rgba(255,255,255,0.18); }
  .upg-btn.sell { background: rgba(255, 90, 110, 0.2); border-color: rgba(255,90,110,0.4); }
  .upg-btn.sell:hover { background: rgba(255, 90, 110, 0.35); }

  .overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    z-index: 100; background: radial-gradient(ellipse at center, rgba(20,10,40,0.75), rgba(0,0,0,0.9));
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .overlay-card {
    padding: 36px 48px; text-align: center; max-width: 420px;
  }
  .overlay-card h1 {
    font-size: 36px; margin: 0 0 6px 0;
    background: linear-gradient(90deg, #ff7a8a, #ffd54a, #5ec8ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    font-weight: 900; letter-spacing: 2px;
  }
  .overlay-card h2 {
    font-size: 24px; margin: 0 0 14px 0;
    background: linear-gradient(90deg, #ffd54a, #ff7a8a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    font-weight: 800;
  }
  .overlay-card p { margin: 0 0 22px 0; font-size: 14px; opacity: 0.85; line-height: 1.6; }
  .overlay-btn {
    padding: 12px 32px; font-size: 16px; font-weight: 700;
    border-radius: 30px; border: none; cursor: pointer;
    background: linear-gradient(135deg, #ff7a8a, #ffd54a);
    color: #1a0f2e; transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 6px 20px rgba(255, 122, 138, 0.4);
  }
  .overlay-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(255, 122, 138, 0.55); }
  .overlay-btn:active { transform: translateY(0); }

  #winScreen .overlay-card h2 {
    background: linear-gradient(90deg, #5ec8ff, #ffd54a);
    -webkit-background-clip: text; background-clip: text;
  }
  #loseScreen .overlay-card h2 {
    background: linear-gradient(90deg, #ff5a6e, #ff9a5a);
    -webkit-background-clip: text; background-clip: text;
  }

  #tooltip {
    position: fixed; pointer-events: none; padding: 6px 10px;
    font-size: 12px; border-radius: 6px; z-index: 200;
    display: none;
  }

  @media (max-width: 640px) {
    #topHud { padding: 6px 10px; gap: 6px; }
    .stat-box { font-size: 12px; padding: 4px 8px; }
    #upgradePanel { width: 180px; right: 8px; }
    .overlay-card { padding: 24px 28px; }
    .overlay-card h1 { font-size: 26px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="topHud" class="hud-panel">
  <div class="stat-box" id="money"><i class="fas fa-coins"></i><span>$500</span></div>
  <div class="stat-box" id="lives"><i class="fas fa-heart"></i><span>20</span></div>
  <div class="stat-box" id="wave"><i class="fas fa-flag"></i><span>第 0 波</span></div>
</div>

<div id="controlsHud" class="hud-panel" style="padding:10px;">
  <div class="ctrl-btn" id="btnStartWave" title="開始波次"><i class="fas fa-play"></i></div>
  <div class="ctrl-btn" id="btnSpeed" title="切換速度"><i class="fas fa-forward"></i></div>
  <div class="ctrl-btn" id="btnResetCam" title="重置視角"><i class="fas fa-camera"></i></div>
</div>

<div id="towerBar" class="hud-panel"></div>

<div id="upgradePanel" class="hud-panel">
  <h3 id="upgTitle">升級塔</h3>
  <button class="upg-btn" id="upgA">攻擊力 A</button>
  <button class="upg-btn" id="upgB">射速+射程 B</button>
  <button class="upg-btn sell" id="upgSell">出售</button>
</div>

<div id="tooltip" class="hud-panel"></div>

<div id="startScreen" class="overlay">
  <div class="overlay-card hud-panel">
    <h1>水果塔防傳奇 3D</h1>
    <p>阻止貪吃的水果大軍抵達終點！<br>選擇水果塔、升級技能、守護你的果園。</p>
    <button class="overlay-btn" id="btnStart">開始遊戲</button>
  </div>
</div>

<div id="winScreen" class="overlay" style="display:none;">
  <div class="overlay-card hud-panel">
    <h2>🍓 勝利！</h2>
    <p>你成功守護了果園！水果大軍已被擊退。</p>
    <button class="overlay-btn" id="btnWinRestart">再玩一次</button>
  </div>
</div>

<div id="loseScreen" class="overlay" style="display:none;">
  <div class="overlay-card hud-panel">
    <h2>💀 失敗</h2>
    <p>水果大軍突破了防線，再接再厲！</p>
    <button class="overlay-btn" id="btnLoseRestart">重新挑戰</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ===== Renderer =====
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;

  // ===== Scene & Camera =====
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.Fog(0x87ceeb, 60, 180);

  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 500);
  camera.position.set(0, 38, 48);
  camera.lookAt(0, 0, 0);

  // ===== Lights =====
  const hemiLight = new THREE.HemisphereLight(0xfff7d6, 0x3d5a3d, 0.65);
  scene.add(hemiLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
  dirLight.position.set(30, 50, 20);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(2048, 2048);
  dirLight.shadow.camera.near = 1;
  dirLight.shadow.camera.far = 150;
  dirLight.shadow.camera.left = -50;
  dirLight.shadow.camera.right = 50;
  dirLight.shadow.camera.top = 50;
  dirLight.shadow.camera.bottom = -50;
  dirLight.shadow.bias = -0.0005;
  scene.add(dirLight);

  const ambient = new THREE.AmbientLight(0xffffff, 0.25);
  scene.add(ambient);

  // ===== Controls =====
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 18;
  controls.maxDistance = 90;
  controls.maxPolarAngle = Math.PI / 2.15;
  controls.minPolarAngle = Math.PI / 6;
  controls.target.set(0, 0, 0);

  // ===== Ground =====
  const GROUND_SIZE = 80;
  const groundGeo = new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE, 40, 40);
  const groundMat = new THREE.MeshStandardMaterial({
    color: 0x6ec07a, roughness: 0.95, metalness: 0.0
  });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Grid overlay
  const grid = new THREE.GridHelper(GROUND_SIZE, 40, 0x2e5d34, 0x3f8048);
  grid.position.y = 0.02;
  grid.material.opacity = 0.35;
  grid.material.transparent = true;
  scene.add(grid);

  // ===== Path waypoints (XZ plane, winding) =====
  const PATH = [
    new THREE.Vector3(-34,  0,  28),
    new THREE.Vector3(-22,  0,  28),
    new THREE.Vector3(-12,  0,  18),
    new THREE.Vector3(-12,  0,   4),
    new THREE.Vector3( -2,  0,  -4),
    new THREE.Vector3( 14,  0,  -4),
    new THREE.Vector3( 22,  0,   6),
    new THREE.Vector3( 22,  0,  18),
    new THREE.Vector3( 12,  0,  26),
    new THREE.Vector3(  2,  0,  18),
    new THREE.Vector3(  2,  0,   2),
    new THREE.Vector3(-18,  0,   2),
    new THREE.Vector3(-26,  0, -10),
    new THREE.Vector3(-18,  0, -22),
    new THREE.Vector3(  0,  0, -22),
    new THREE.Vector3( 16,  0, -14),
    new THREE.Vector3( 30,  0,  -2)
  ];

  // Build path mesh (tube/ribbon)
  function buildPathMesh() {
    const curve = new THREE.CatmullRomCurve3(PATH, false, 'catmullrom', 0.2);
    const tubeGeo = new THREE.TubeGeometry(curve, 220, 2.2, 12, false);
    const tubeMat = new THREE.MeshStandardMaterial({
      color: 0x8b6a4a, roughness: 0.85, metalness: 0.05
    });
    const tube = new THREE.Mesh(tubeGeo, tubeMat);
    tube.receiveShadow = true;
    tube.castShadow = false;
    tube.position.y = 0.05;
    return { mesh: tube, curve: curve };
  }
  const pathData = buildPathMesh();
  scene.add(pathData.mesh);

  // Edge highlight strips
  const edgeGeo = new THREE.BoxGeometry(0.6, 0.1, 0.6);
  const edgeMat = new THREE.MeshStandardMaterial({ color: 0xfff1c2, emissive: 0x553311 });
  PATH.forEach(function (p) {
    const m = new THREE.Mesh(edgeGeo, edgeMat);
    m.position.set(p.x, 0.1, p.z);
    scene.add(m);
  });

  // Start & end markers
  const startMat = new THREE.MeshStandardMaterial({ color: 0x5ec8ff, emissive: 0x224466 });
  const endMat   = new THREE.MeshStandardMaterial({ color: 0xff5a6e, emissive: 0x661122 });
  const markerGeo = new THREE.CylinderGeometry(1.6, 1.6, 0.3, 24);
  const startMarker = new THREE.Mesh(markerGeo, startMat);
  startMarker.position.set(PATH[0].x, 0.18, PATH[0].z);
  scene.add(startMarker);
  const endMarker = new THREE.Mesh(markerGeo, endMat);
  endMarker.position.set(PATH[PATH.length - 1].x, 0.18, PATH[PATH.length - 1].z);
  scene.add(endMarker);

  // ===== Particle placeholder =====
  const PARTICLE_COUNT = 400;
  const particleGeo = new THREE.BufferGeometry();
  const pPositions = new Float32Array(PARTICLE_COUNT * 3);
  const pColors = new Float32Array(PARTICLE_COUNT * 3);
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    pPositions[i * 3 + 0] = (Math.random() - 0.5) * GROUND_SIZE;
    pPositions[i * 3 + 1] = Math.random() * 25 + 2;
    pPositions[i * 3 + 2] = (Math.random() - 0.5) * GROUND_SIZE;
    const c = new THREE.Color().setHSL(Math.random(), 0.6, 0.65);
    pColors[i * 3 + 0] = c.r;
    pColors[i * 3 + 1] = c.g;
    pColors[i * 3 + 2] = c.b;
  }
  particleGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
  particleGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));
  const particleMat = new THREE.PointsMaterial({
    size: 0.35, vertexColors: true, transparent: true,
    opacity: 0.7, depthWrite: false, sizeAttenuation: true
  });
  const particles = new THREE.Points(particleGeo, particleMat);
  scene.add(particles);

  // ===== Helpers =====
  const clock = new THREE.Clock();

  function snapCameraTo(mapCenter) {
    controls.target.set(mapCenter.x, 0, mapCenter.z);
    camera.position.set(mapCenter.x + 0.1, 42, mapCenter.z + 50);
    controls.update();
  }

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ===== Game Constants =====
  const CELL = 2;
  const GRID_HALF = 20; // cells from -20..19 => world -40..38
  const START_MONEY = 500;
  const START_LIVES = 20;
  const TOTAL_WAVES = 20;

  // ===== State =====
  const state = {
    money: START_MONEY,
    lives: START_LIVES,
    wave: 0,
    speed: 1,
    running: false,
    gameOver: false,
    won: false,
    selectedTowerType: null,
    selectedTower: null,
    waveActive: false,
    spawnQueue: [],
    spawnTimer: 0,
    enemies: [],
    towers: [],
    projectiles: [],
    effects: [], // burn zones, visual FX
    particlesFx: [],
    ghostMesh: null,
    rangeMesh: null,
    occupied: new Set()
  };


  // ===== Tower Definitions (12) — 水果塔防傳奇 3D =====
  // effect types: balanced, knockback(boomerang), splash, pierce, split, armor(shred permanent), stun, poison, burn, slow
  const TOWER_DEFS = [
    { id:'apple',       name:'蘋果塔',   emoji:'🍎', cost:50,  color:0xff3344, range:9,  fireRate:1.2, damage:12, effect:'balanced',   desc:'均衡基礎塔' },
    { id:'banana',      name:'香蕉塔',   emoji:'🍌', cost:75,  color:0xffe135, range:8,  fireRate:1.0, damage:10, effect:'knockback',  knock:3.5, desc:'迴旋鏢 + 擊退 knockback' },
    { id:'watermelon',  name:'西瓜塔',   emoji:'🍉', cost:100, color:0x44bb55, range:8,  fireRate:0.7, damage:16, effect:'splash',     splashR:3.2, desc:'範圍濺射 splash' },
    { id:'strawberry',  name:'草莓塔',   emoji:'🍓', cost:60,  color:0xff4477, range:7,  fireRate:2.6, damage:6,  effect:'balanced',   desc:'超高射速' },
    { id:'pineapple',   name:'鳳梨塔',   emoji:'🍍', cost:90,  color:0xddaa22, range:9,  fireRate:1.0, damage:14, effect:'pierce',     pierce:3, desc:'穿透 pierce' },
    { id:'grape',       name:'葡萄塔',   emoji:'🍇', cost:80,  color:0x8844cc, range:8,  fireRate:1.1, damage:9,  effect:'split',      splits:3, desc:'擊中分裂' },
    { id:'lemon',       name:'檸檬塔',   emoji:'🍋', cost:85,  color:0xffee44, range:8,  fireRate:1.15,damage:8,  effect:'armorShred', shred:0.15, shredDur:999, permanentShred:true, desc:'永久破甲 armor shred' },
    { id:'coconut',     name:'椰子塔',   emoji:'🥥', cost:95,  color:0x8b5a2b, range:7.5,fireRate:0.9, damage:11, effect:'stun',       stunDur:0.8, desc:'暈眩 stun' },
    { id:'mango',       name:'芒果塔',   emoji:'🥭', cost:120, color:0xffaa22, range:16, fireRate:0.55,damage:28, effect:'balanced',   desc:'遠程狙擊' },
    { id:'blueberry',   name:'藍莓塔',   emoji:'🫐', cost:70,  color:0x4466cc, range:8,  fireRate:1.5, damage:5,  effect:'poison',     poisonDps:5, poisonDur:3.2, desc:'毒素 DoT poison' },
    { id:'dragonfruit', name:'火龍果塔', emoji:'🐉', cost:110, color:0xff66aa, range:8.5,fireRate:0.85,damage:10, effect:'burn',       burnR:2.6, burnDps:8, burnDur:2.8, desc:'燃燒地面 burn zone' },
    { id:'kiwi',        name:'奇異果塔', emoji:'🥝', cost:65,  color:0x88aa44, range:8,  fireRate:1.3, damage:7,  effect:'slow',       slowAmt:0.45, slowDur:2.0, desc:'減速 slow' }
  ];

  const TOWER_MAP = {};
  TOWER_DEFS.forEach(t => TOWER_MAP[t.id] = t);


  // ===== Enemy Definitions (≥8 fruit foes) =====
  const ENEMY_DEFS = {
    rottenApple:       { name:'腐爛蘋果',   hp:40,   speed:2.4, reward:6,  armor:0,    color:0x884422, scale:0.55, shape:'sphere' },
    moldyBanana:       { name:'發霉香蕉',   hp:55,   speed:3.4, reward:8,  armor:0,    color:0xaa9944, scale:0.5,  shape:'cyl', split:true },
    smallMoldyBanana:  { name:'小發霉香蕉', hp:22,   speed:3.8, reward:3,  armor:0,    color:0xbb8855, scale:0.32, shape:'cyl' },
    rottingWatermelon: { name:'腐爛西瓜',   hp:220,  speed:1.1, reward:20, armor:0.18, color:0x446633, scale:0.95, shape:'sphere', explode:true },
    fruitFly:          { name:'果蠅',       hp:28,   speed:3.6, reward:5,  armor:0,    color:0x333333, scale:0.35, shape:'cone', flying:true },
    ironPomegranate:   { name:'鐵石榴',     hp:140,  speed:1.5, reward:14, armor:0.35, color:0x777788, scale:0.65, shape:'box' },
    spikyCucumber:     { name:'尖刺黃瓜',   hp:75,   speed:2.6, reward:9,  armor:0.08, color:0x55aa55, scale:0.55, shape:'cyl' },
    venomEggplant:     { name:'毒茄子',     hp:110,  speed:1.9, reward:12, armor:0.12, color:0x553366, scale:0.65, shape:'sphere' },
    giantPumpkinKing:  { name:'巨型南瓜王', hp:1600, speed:0.85,reward:200,armor:0.28, color:0xff7711, scale:1.55, shape:'boss', boss:true }
  };



  // ===== Wave Table (20 explicit) — bosses on 10 & 20 =====
  function makeWave(entries, earlyBonus) {
    const w = entries; w.earlyBonus = earlyBonus || 30; return w;
  }
  const WAVES = [
    makeWave([['rottenApple',8,0.7]], 25),
    makeWave([['rottenApple',10,0.55],['fruitFly',4,0.5]], 30),
    makeWave([['rottenApple',8,0.55],['moldyBanana',5,0.65]], 35),
    makeWave([['fruitFly',12,0.4],['spikyCucumber',4,0.7]], 40),
    makeWave([['rottenApple',10,0.5],['moldyBanana',6,0.55],['fruitFly',6,0.4]], 45),
    makeWave([['spikyCucumber',8,0.55],['venomEggplant',3,0.9]], 50),
    makeWave([['moldyBanana',10,0.45],['ironPomegranate',3,1.0]], 55),
    makeWave([['rottingWatermelon',3,1.2],['fruitFly',10,0.35],['rottenApple',8,0.45]], 60),
    makeWave([['venomEggplant',6,0.7],['spikyCucumber',8,0.5],['ironPomegranate',4,0.9]], 70),

  // ===== Mesh builders (procedural recognizable fruit) =====
  function makeFruitMesh(def, scale) {
    const g = new THREE.Group();
    const s = scale || 1;
    const mat = new THREE.MeshStandardMaterial({ color: def.color, roughness: 0.55, metalness: 0.1 });
    const id = def.id;
    if (id === 'apple') {
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.55*s, 16, 12), mat);
      body.position.y = 0.55*s; body.castShadow = true; g.add(body);
      const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.16*s, 8, 6), new THREE.MeshStandardMaterial({ color: 0x33aa33 }));
      leaf.scale.set(1.5, 0.3, 1); leaf.position.set(0.15*s, 1.1*s, 0); g.add(leaf);
    } else if (id === 'banana') {
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-0.5*s, 0.35*s, 0), new THREE.Vector3(-0.15*s, 0.95*s, 0),
        new THREE.Vector3(0.15*s, 0.95*s, 0), new THREE.Vector3(0.5*s, 0.35*s, 0)
      ]);
      const body = new THREE.Mesh(new THREE.TubeGeometry(curve, 16, 0.14*s, 8, false), mat);
      body.castShadow = true; g.add(body);
    } else if (id === 'watermelon') {
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.7*s, 16, 12), mat);
      body.position.y = 0.55*s; body.castShadow = true; g.add(body);
      for (let i = 0; i < 6; i++) {
        const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.08*s, 1.15*s, 0.08*s), new THREE.MeshStandardMaterial({ color: 0x226633 }));
        const a = (i/6)*Math.PI*2;
        stripe.position.set(Math.cos(a)*0.55*s, 0.55*s, Math.sin(a)*0.55*s); g.add(stripe);
      }
    } else if (id === 'strawberry') {
      const body = new THREE.Mesh(new THREE.ConeGeometry(0.5*s, 1.0*s, 14), mat);
      body.position.y = 0.5*s; body.castShadow = true; g.add(body);
      for (let i = 0; i < 10; i++) {
        const seed = new THREE.Mesh(new THREE.SphereGeometry(0.04*s, 4, 4), new THREE.MeshStandardMaterial({ color: 0xffee44 }));
        const a = Math.random()*Math.PI*2, r = 0.28*s + Math.random()*0.12*s;
        seed.position.set(Math.cos(a)*r, 0.2*s + Math.random()*0.7*s, Math.sin(a)*r); g.add(seed);
      }
      const top = new THREE.Mesh(new THREE.ConeGeometry(0.18*s, 0.25*s, 6), new THREE.MeshStandardMaterial({ color: 0x33aa33 }));
      top.position.y = 1.05*s; g.add(top);
    } else if (id === 'pineapple') {
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.45*s, 0.52*s, 1.1*s, 12), mat);
      body.position.y = 0.6*s; body.castShadow = true; g.add(body);
      for (let i = 0; i < 6; i++) {
        const a = (i/6)*Math.PI*2;
        const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.08*s, 0.5*s, 4), new THREE.MeshStandardMaterial({ color: 0x33aa33 }));
        leaf.position.set(Math.cos(a)*0.1*s, 1.3*s, Math.sin(a)*0.1*s);
        leaf.rotation.z = -Math.cos(a)*0.4; leaf.rotation.x = Math.sin(a)*0.4; g.add(leaf);
      }
    } else if (id === 'grape' || id === 'blueberry') {
      for (let i = 0; i < 9; i++) {
        const a = (i/9)*Math.PI*2;
        const r = i < 3 ? 0 : 0.26*s;
        const b = new THREE.Mesh(new THREE.SphereGeometry(0.16*s, 8, 8), mat);
        b.position.set(Math.cos(a)*r, 0.4*s + (i%3)*0.14*s, Math.sin(a)*r);
        b.castShadow = true; g.add(b);
      }
    } else if (id === 'lemon') {
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.52*s, 14, 10), mat);
      body.scale.set(1.2, 0.9, 0.85); body.position.y = 0.55*s; body.castShadow = true; g.add(body);
    } else if (id === 'coconut') {
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.58*s, 14, 12), new THREE.MeshStandardMaterial({ color: def.color, roughness: 0.95 }));
      body.position.y = 0.55*s; body.castShadow = true; g.add(body);
    } else if (id === 'mango') {
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.5*s, 14, 10), mat);
      body.scale.set(0.9, 1.35, 0.75); body.position.y = 0.7*s; body.castShadow = true; g.add(body);
    } else if (id === 'dragonfruit') {
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.55*s, 14, 10), mat);
      body.scale.set(1, 1.2, 1); body.position.y = 0.65*s; body.castShadow = true; g.add(body);
      for (let i = 0; i < 5; i++) {
        const a = (i/5)*Math.PI*2;
        const scaleLeaf = new THREE.Mesh(new THREE.ConeGeometry(0.07*s, 0.22*s, 4), new THREE.MeshStandardMaterial({ color: 0x33aa33 }));
        scaleLeaf.position.set(Math.cos(a)*0.48*s, 0.75*s, Math.sin(a)*0.48*s); g.add(scaleLeaf);
      }
    } else if (id === 'kiwi') {
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.55*s, 14, 10), new THREE.MeshStandardMaterial({ color: 0x8b6914, roughness: 1 }));
      body.position.y = 0.55*s; body.castShadow = true; g.add(body);
      const core = new THREE.Mesh(new THREE.CircleGeometry(0.32*s, 16), new THREE.MeshBasicMaterial({ color: 0xa8c93a, side: THREE.DoubleSide }));
      core.position.set(0, 0.55*s, 0.52*s); g.add(core);
    } else {
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.55*s, 14, 14), mat);
      body.position.y = 0.55*s; body.castShadow = true; g.add(body);
    }
    const base = new THREE.Mesh(
      new THREE.CylinderGeometry(0.55*s, 0.65*s, 0.25*s, 12),
      new THREE.MeshStandardMaterial({ color: 0x5d4037, roughness: 0.8 })
    );
    base.position.y = -0.05 * s; base.receiveShadow = true; g.add(base);
    g.position.y = 0.5;
    return g;
  }

  function makeEnemyMesh(def) {
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: def.color, roughness: 0.6, metalness: 0.05 });
    const s = def.scale;
    let body;
    if (def.shape === 'box') body = new THREE.Mesh(new THREE.BoxGeometry(0.8*s, 0.6*s, 0.8*s), mat);
    else if (def.shape === 'cone') body = new THREE.Mesh(new THREE.ConeGeometry(0.4*s, 0.9*s, 8), mat);
    else if (def.shape === 'cyl') body = new THREE.Mesh(new THREE.CylinderGeometry(0.3*s, 0.35*s, 1.0*s, 10), mat);
    else if (def.shape === 'boss') {
      body = new THREE.Mesh(new THREE.SphereGeometry(0.7*s, 18, 18), mat);
      const crown = new THREE.Mesh(new THREE.ConeGeometry(0.35*s, 0.6*s, 5), new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0x664400 }));
      crown.position.y = 0.9 * s;
      g.add(crown);
    } else body = new THREE.Mesh(new THREE.SphereGeometry(0.45*s, 12, 12), mat);
    body.castShadow = true;
    body.position.y = 0.4 * s;
    g.add(body);
    // HP bar
    const barBg = new THREE.Mesh(
      new THREE.PlaneGeometry(1.2 * s, 0.12),
      new THREE.MeshBasicMaterial({ color: 0x222222, transparent: true, opacity: 0.7, depthTest: false })
    );
    barBg.position.y = 1.2 * s;
    g.add(barBg);
    const barFg = new THREE.Mesh(
      new THREE.PlaneGeometry(1.15 * s, 0.09),
      new THREE.MeshBasicMaterial({ color: 0x2ecc71, depthTest: false })
    );
    barFg.position.y = 1.2 * s;
    barFg.position.z = 0.01;
    g.add(barFg);
    g.userData.hpBar = barFg;
    g.userData.hpBarW = 1.15 * s;
    return g;
  }

  function updateGhost(id) {
    if (state.ghostMesh) { scene.remove(state.ghostMesh); state.ghostMesh = null; }
    if (state.rangeMesh) { scene.remove(state.rangeMesh); state.rangeMesh = null; }
    if (!id) return;
    const def = TOWER_MAP[id];
    state.ghostMesh = makeFruitMesh(def, 1);
    state.ghostMesh.traverse(o => {
      if (o.isMesh) {
        o.material = o.material.clone();
        o.material.transparent = true;
        o.material.opacity = 0.45;
        o.material.depthWrite = false;
      }
    });
    state.ghostMesh.visible = false;
    scene.add(state.ghostMesh);
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(def.range - 0.15, def.range, 48),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.25, side: THREE.DoubleSide, depthWrite: false })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.12;
    ring.visible = false;
    state.rangeMesh = ring;
    scene.add(ring);
  }

  // ===== Path / placement helpers =====
  const pathCurve = pathData.curve;
  const pathLen = pathCurve.getLength();

  function worldToCell(x, z) {
    const cx = Math.floor((x + GROUND_SIZE / 2) / CELL);
    const cz = Math.floor((z + GROUND_SIZE / 2) / CELL);
    return { cx, cz };
  }
  function cellToWorld(cx, cz) {
    return {
      x: -GROUND_SIZE / 2 + cx * CELL + CELL / 2,
      z: -GROUND_SIZE / 2 + cz * CELL + CELL / 2
    };
  }
  function cellKey(cx, cz) { return cx + ',' + cz; }

  function distToPath(x, z) {
    let minD = Infinity;
    const N = 80;
    const v = new THREE.Vector3();
    for (let i = 0; i <= N; i++) {
      pathCurve.getPoint(i / N, v);
      const d = Math.hypot(v.x - x, v.z - z);
      if (d < minD) minD = d;
    }
    return minD;
  }

  function canPlace(cx, cz) {
    if (cx < 2 || cz < 2 || cx >= 38 || cz >= 38) return false;
    if (state.occupied.has(cellKey(cx, cz))) return false;
    const w = cellToWorld(cx, cz);
    if (distToPath(w.x, w.z) < 3.2) return false;
    return true;
  }

  // ===== Raycasting =====
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

  function getGroundPoint(clientX, clientY) {
    mouse.x = (clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const pt = new THREE.Vector3();
    if (raycaster.ray.intersectPlane(groundPlane, pt)) return pt;
    return null;
  }

  canvas.addEventListener('pointermove', e => {
    if (!state.selectedTowerType || !state.ghostMesh) return;
    const pt = getGroundPoint(e.clientX, e.clientY);
    if (!pt) return;
    const { cx, cz } = worldToCell(pt.x, pt.z);
    const w = cellToWorld(cx, cz);
    state.ghostMesh.visible = true;
    state.ghostMesh.position.set(w.x, 0.5, w.z);
    if (state.rangeMesh) {
      state.rangeMesh.visible = true;
      state.rangeMesh.position.set(w.x, 0.12, w.z);
    }
    const ok = canPlace(cx, cz) && state.money >= TOWER_MAP[state.selectedTowerType].cost;
    state.ghostMesh.traverse(o => {
      if (o.isMesh && o.material && o.material.color) {
        o.material.color.setHex(ok ? 0x88ff88 : 0xff5555);
      }
    });
  });

  canvas.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    if (!state.running || state.gameOver) return;
    // check tower click first
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const towerMeshes = state.towers.map(t => t.mesh);
    const hits = raycaster.intersectObjects(towerMeshes, true);
    if (hits.length) {
      let obj = hits[0].object;
      while (obj.parent && !obj.userData.towerRef) obj = obj.parent;
      if (obj.userData.towerRef) {
        selectPlacedTower(obj.userData.towerRef);
        return;
      }
    }
    if (state.selectedTowerType) {
      const pt = getGroundPoint(e.clientX, e.clientY);
      if (!pt) return;
      const { cx, cz } = worldToCell(pt.x, pt.z);
      tryPlaceTower(cx, cz, state.selectedTowerType);
    } else {
      state.selectedTower = null;
      upgradePanel.classList.remove('show');
      if (state.rangeMesh) state.rangeMesh.visible = false;
    }
  });

  function tryPlaceTower(cx, cz, typeId) {
    const def = TOWER_MAP[typeId];
    if (!def || state.money < def.cost) return;
    if (!canPlace(cx, cz)) return;
    const w = cellToWorld(cx, cz);
    const mesh = makeFruitMesh(def, 1);
    mesh.position.set(w.x, 0.5, w.z);
    mesh.userData.towerRef = null;
    scene.add(mesh);
    const tower = {
      def: Object.assign({}, def),
      mesh, cx, cz,
      cooldown: 0,
      spent: def.cost,
      levelA: 0,
      levelB: 0,
      maxLevel: 3
    };
    mesh.userData.towerRef = tower;
    state.towers.push(tower);
    state.occupied.add(cellKey(cx, cz));
    state.money -= def.cost;
    updateHUD();
    // keep selection for multi-place
  }

  function selectPlacedTower(tower) {
    clearTowerTypeSelection();
    state.selectedTower = tower;
    upgTitle.textContent = tower.def.emoji + ' ' + tower.def.name + ' Lv' + (tower.levelA + tower.levelB);
    const costA = Math.floor(tower.def.cost * (0.6 + tower.levelA * 0.4));
    const costB = Math.floor(tower.def.cost * (0.55 + tower.levelB * 0.4));
    upgA.textContent = '⬆ 強化攻擊 A ($' + costA + ') Lv' + tower.levelA + '/' + tower.maxLevel;
    upgB.textContent = '⬆ 強化射速+射程 B ($' + costB + ') Lv' + tower.levelB + '/' + tower.maxLevel;
    upgSell.textContent = '💰 出售 (+$' + Math.floor(tower.spent * 0.6) + ')';
    upgradePanel.classList.add('show');
    if (!state.rangeMesh) {
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(tower.def.range - 0.15, tower.def.range, 48),
        new THREE.MeshBasicMaterial({ color: 0xffd54a, transparent: true, opacity: 0.3, side: THREE.DoubleSide, depthWrite: false })
      );
      ring.rotation.x = -Math.PI / 2;
      state.rangeMesh = ring;
      scene.add(ring);
    } else {
      state.rangeMesh.geometry.dispose();
      state.rangeMesh.geometry = new THREE.RingGeometry(tower.def.range - 0.15, tower.def.range, 48);
      state.rangeMesh.material.color.setHex(0xffd54a);
    }
    state.rangeMesh.position.set(tower.mesh.position.x, 0.12, tower.mesh.position.z);
    state.rangeMesh.visible = true;
  }

  upgA.addEventListener('click', () => {
    const t = state.selectedTower;
    if (!t || t.levelA >= t.maxLevel) return;
    const cost = Math.floor(t.def.cost * (0.6 + t.levelA * 0.4));
    if (state.money < cost) return;
    state.money -= cost;
    t.spent += cost;
    t.levelA++;
    t.def.damage = Math.floor(t.def.damage * 1.4);
    if (t.def.splashR) t.def.splashR *= 1.08;
    if (t.def.poisonDps) t.def.poisonDps *= 1.25;
    if (t.def.burnDps) t.def.burnDps *= 1.25;
    t.mesh.scale.setScalar(1 + (t.levelA + t.levelB) * 0.1);
    updateHUD();
    selectPlacedTower(t);
  });
  upgB.addEventListener('click', () => {
    const t = state.selectedTower;
    if (!t || t.levelB >= t.maxLevel) return;
    const cost = Math.floor(t.def.cost * (0.55 + t.levelB * 0.4));
    if (state.money < cost) return;
    state.money -= cost;
    t.spent += cost;
    t.levelB++;
    t.def.fireRate *= 1.25;
    t.def.range *= 1.15;
    if (t.def.slowDur) t.def.slowDur *= 1.15;
    if (t.def.stunDur) t.def.stunDur *= 1.15;
    if (t.def.shredDur) t.def.shredDur *= 1.15;
    t.mesh.scale.setScalar(1 + (t.levelA + t.levelB) * 0.1);
    updateHUD();
    selectPlacedTower(t);
  });
  upgSell.addEventListener('click', () => {
    const t = state.selectedTower;
    if (!t) return;
    state.money += Math.floor(t.spent * 0.6);
    scene.remove(t.mesh);
    state.occupied.delete(cellKey(t.cx, t.cz));
    state.towers = state.towers.filter(x => x !== t);
    state.selectedTower = null;
    upgradePanel.classList.remove('show');
    if (state.rangeMesh) state.rangeMesh.visible = false;
    updateHUD();
  });

  // ===== Enemies =====
  function spawnEnemy(typeId) {
    const def = ENEMY_DEFS[typeId];
    if (!def) return;
    const mesh = makeEnemyMesh(def);
    const start = pathCurve.getPoint(0);
    mesh.position.set(start.x, 0, start.z);
    scene.add(mesh);
    const e = {
      def, mesh,
      hp: def.hp,
      maxHp: def.hp,
      speed: def.speed,
      armor: def.armor,
      progress: 0,
      alive: true,
      statuses: {}, // poison, burn, slow, stun, shred
      burnZone: false
    };
    state.enemies.push(e);
  }

  function damageEnemy(e, raw, opts) {
    if (!e.alive) return;
    opts = opts || {};
    // permanent armor shred (lemon)
    if (opts.permanentShred) {
      e.armor = Math.max(0, e.armor - (opts.shred || 0.15));
    }
    let armor = e.armor;
    if (e.statuses.shred && e.statuses.shred.t > 0) armor = Math.max(0, armor - e.statuses.shred.amt);
    const dmg = Math.max(1, raw * (1 - armor));
    e.hp -= dmg;
    // flash
    e.mesh.traverse(o => {
      if (o.isMesh && o.material && o.material.emissive) {
        o.material.emissive.setHex(0xffffff);
        setTimeout(() => { if (o.material) o.material.emissive.setHex(0x000000); }, 60);
      }
    });
    if (opts.poison) {
      e.statuses.poison = { t: opts.poisonDur, dps: opts.poisonDps };
    }
    if (opts.slow) {
      e.statuses.slow = { t: opts.slowDur, amt: opts.slowAmt };
    }
    if (opts.stun) {
      e.statuses.stun = { t: opts.stunDur };
    }
    if (opts.shred) {
      e.statuses.shred = { t: opts.shredDur, amt: opts.shred };
    }
    if (opts.knock) {
      e.progress = Math.max(0, e.progress - opts.knock / pathLen);
    }
    updateEnemyHpBar(e);
    if (e.hp <= 0) killEnemy(e);
  }

  function updateEnemyHpBar(e) {
    const bar = e.mesh.userData.hpBar;
    if (!bar) return;
    const r = Math.max(0, e.hp / e.maxHp);
    bar.scale.x = Math.max(0.001, r);
    bar.position.x = -((1 - r) * e.mesh.userData.hpBarW) / 2;
    bar.material.color.setHex(r > 0.5 ? 0x2ecc71 : r > 0.25 ? 0xf1c40f : 0xe74c3c);
  }

  function killEnemy(e) {
    if (!e.alive) return;
    e.alive = false;
    state.money += e.def.reward;
    spawnBurst(e.mesh.position, e.def.color);
    const prog = e.progress;
    const pos = e.mesh.position.clone();
    scene.remove(e.mesh);
    if (e.def.split) {
      for (let i = 0; i < 2; i++) {
        spawnEnemy('smallMoldyBanana');
        const child = state.enemies[state.enemies.length - 1];
        if (child) child.progress = Math.max(0, prog - 0.015 * (i + 1));
      }
    }
    if (e.def.explode) {
      for (const o of state.enemies) {
        if (!o.alive || o === e) continue;
        const dx = o.mesh.position.x - pos.x, dz = o.mesh.position.z - pos.z;
        if (dx*dx + dz*dz < 12) damageEnemy(o, 35, {});
      }
    }
    updateHUD();
  }

  function spawnBurst(pos, color) {
    for (let i = 0; i < 8; i++) {
      const m = new THREE.Mesh(
        new THREE.SphereGeometry(0.15, 6, 6),
        new THREE.MeshBasicMaterial({ color: color || 0xffd54a })
      );
      m.position.copy(pos);
      m.position.y += 0.5;
      scene.add(m);
      state.particlesFx.push({
        mesh: m,
        vel: new THREE.Vector3((Math.random()-0.5)*6, Math.random()*5+2, (Math.random()-0.5)*6),
        life: 0.5 + Math.random()*0.3
      });
    }
  }

  // ===== Combat / Projectiles =====
  function findTarget(tower) {
    let best = null, bestProg = -1;
    const tx = tower.mesh.position.x, tz = tower.mesh.position.z;
    const r2 = tower.def.range * tower.def.range;
    for (let i = 0; i < state.enemies.length; i++) {
      const e = state.enemies[i];
      if (!e.alive) continue;
      const dx = e.mesh.position.x - tx, dz = e.mesh.position.z - tz;
      if (dx*dx + dz*dz <= r2 && e.progress > bestProg) {
        bestProg = e.progress;
        best = e;
      }
    }
    return best;
  }

  function fireTower(tower, target) {
    const def = tower.def;
    const origin = tower.mesh.position.clone();
    origin.y += 1.0;

    if (def.effect === 'burn') {
      // create burn zone at target
      createBurnZone(target.mesh.position.clone(), def);
      damageEnemy(target, def.damage);
      return;
    }

    const proj = {
      mesh: new THREE.Mesh(
        new THREE.SphereGeometry(0.22, 8, 8),
        new THREE.MeshBasicMaterial({ color: def.color })
      ),
      pos: origin.clone(),
      target: target,
      speed: 28,
      def: def,
      tower: tower,
      pierced: [],
      splitDone: false,
      alive: true
    };
    proj.mesh.position.copy(origin);
    scene.add(proj.mesh);
    state.projectiles.push(proj);
  }

  function createBurnZone(pos, def) {
    const geo = new THREE.CircleGeometry(def.burnR || 5, 24);
    const mat = new THREE.MeshBasicMaterial({
      color: 0xff6600, transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.set(pos.x, 0.15, pos.z);
    scene.add(mesh);
    state.effects.push({
      type: 'burn',
      mesh,
      pos: pos.clone(),
      r: def.burnR || 5,
      dps: def.burnDps || 8,
      life: def.burnDur || 3,
      tick: 0
    });
  }

  function spawnSplitShots(from, def, exclude) {
    const n = def.splits || 3;
    const candidates = state.enemies.filter(e => e.alive && e !== exclude);
    candidates.sort((a, b) => {
      const da = a.mesh.position.distanceTo(from);
      const db = b.mesh.position.distanceTo(from);
      return da - db;
    });
    for (let i = 0; i < Math.min(n, candidates.length); i++) {
      const t = candidates[i];
      const proj = {
        mesh: new THREE.Mesh(
          new THREE.SphereGeometry(0.14, 6, 6),
          new THREE.MeshBasicMaterial({ color: def.color })
        ),
        pos: from.clone(),
        target: t,
        speed: 22,
        def: Object.assign({}, def, { effect: 'single', damage: Math.floor(def.damage * 0.55) }),
        tower: null,
        pierced: [],
        splitDone: true,
        alive: true
      };
      proj.mesh.position.copy(from);
      scene.add(proj.mesh);
      state.projectiles.push(proj);
    }
  }

  function applyHit(proj, e) {
    const def = proj.def;
    const opts = {};
    if (def.effect === 'poison') { opts.poison = true; opts.poisonDur = def.poisonDur; opts.poisonDps = def.poisonDps; }
    if (def.effect === 'slow') { opts.slow = true; opts.slowDur = def.slowDur; opts.slowAmt = def.slowAmt; }
    if (def.effect === 'stun') { opts.stun = true; opts.stunDur = def.stunDur; }
    if (def.effect === 'armorShred') { opts.shred = def.shred; opts.shredDur = def.shredDur; opts.permanentShred = !!def.permanentShred; }
    if (def.effect === 'knockback') { opts.knock = def.knock; }

    damageEnemy(e, def.damage, opts);

    if (def.effect === 'splash') {
      const r = def.splashR || 3;
      const r2 = r * r;
      for (const o of state.enemies) {
        if (!o.alive || o === e) continue;
        const dx = o.mesh.position.x - e.mesh.position.x;
        const dz = o.mesh.position.z - e.mesh.position.z;
        if (dx*dx + dz*dz <= r2) damageEnemy(o, def.damage * 0.55, opts);
      }
      spawnBurst(e.mesh.position, def.color);
    }

    if (def.effect === 'pierce') {
      proj.pierced.push(e);
      if (proj.pierced.length >= (def.pierce || 3)) {
        destroyProj(proj);
      } else {
        // retarget further along path
        let next = null, best = -1;
        for (const o of state.enemies) {
          if (!o.alive || proj.pierced.includes(o)) continue;
          if (o.progress > e.progress && o.progress > best) {
            // must be somewhat ahead in similar direction
            const d = o.mesh.position.distanceTo(proj.pos);
            if (d < def.range * 1.5) { best = o.progress; next = o; }
          }
        }
        if (next) proj.target = next;
        else destroyProj(proj);
      }
      return;
    }

    if (def.effect === 'split' && !proj.splitDone) {
      spawnSplitShots(e.mesh.position.clone().add(new THREE.Vector3(0, 0.8, 0)), def, e);
    }

    if (def.effect !== 'pierce') destroyProj(proj);
  }

  function destroyProj(p) {
    if (!p.alive) return;
    p.alive = false;
    scene.remove(p.mesh);
  }

  // ===== Waves =====
  function startNextWave() {
    if (state.gameOver || !state.running) return;
    // Early-call: if wave already active, grant leftover spawn bonus and rush remaining
    if (state.waveActive) {
      if (state.spawnQueue.length > 0) {
        const plan = WAVES[state.wave - 1];
        const total = plan.reduce((s, e) => s + e[1], 0) || 1;
        const bonus = Math.floor((plan.earlyBonus || 25) * (state.spawnQueue.length / total));
        state.money += Math.max(5, bonus);
        state.spawnQueue.forEach(s => { s.gap = Math.min(s.gap, 0.08); });
        updateHUD();
      }
      return;
    }
    if (state.wave >= TOTAL_WAVES) return;
    state.wave++;
    updateHUD();
    const plan = WAVES[state.wave - 1];
    state.spawnQueue = [];
    plan.forEach(([type, count, gap]) => {
      for (let i = 0; i < count; i++) {
        state.spawnQueue.push({ type, gap: i === 0 ? 0.3 : gap });
      }
    });
    state.spawnTimer = 0.2;
    state.waveActive = true;
  }

  function checkWaveEnd() {
    if (!state.waveActive) return;
    if (state.spawnQueue.length === 0 && state.enemies.every(e => !e.alive)) {
      state.waveActive = false;
      state.enemies = [];
      // clear dead
      if (state.wave >= TOTAL_WAVES) {
        winGame();
      }
    }
  }

  function winGame() {
    state.gameOver = true;
    state.won = true;
    state.running = false;
    document.getElementById('winScreen').style.display = 'flex';
  }
  function loseGame() {
    state.gameOver = true;
    state.won = false;
    state.running = false;
    document.getElementById('loseScreen').style.display = 'flex';
  }

  // ===== Update loops =====
  function updateEnemies(dt) {
    const tmp = new THREE.Vector3();
    for (const e of state.enemies) {
      if (!e.alive) continue;
      // statuses
      let spdMul = 1;
      if (e.statuses.stun && e.statuses.stun.t > 0) {
        e.statuses.stun.t -= dt;
        spdMul = 0;
      } else if (e.statuses.slow && e.statuses.slow.t > 0) {
        e.statuses.slow.t -= dt;
        spdMul = 1 - e.statuses.slow.amt;
      }
      if (e.statuses.poison && e.statuses.poison.t > 0) {
        e.statuses.poison.t -= dt;
        e.hp -= e.statuses.poison.dps * dt;
        updateEnemyHpBar(e);
        if (e.hp <= 0) { killEnemy(e); continue; }
      }
      if (e.statuses.burn && e.statuses.burn.t > 0) {
        e.statuses.burn.t -= dt;
        e.hp -= e.statuses.burn.dps * dt;
        updateEnemyHpBar(e);
        if (e.hp <= 0) { killEnemy(e); continue; }
      }
      if (e.statuses.shred && e.statuses.shred.t > 0) e.statuses.shred.t -= dt;

      const dist = e.speed * spdMul * dt;
      e.progress += dist / pathLen;
      if (e.progress >= 1) {
        e.alive = false;
        scene.remove(e.mesh);
        state.lives -= e.def.boss ? 5 : 1;
        updateHUD();
        if (state.lives <= 0) { state.lives = 0; updateHUD(); loseGame(); }
        continue;
      }
      pathCurve.getPoint(e.progress, tmp);
      const flyY = e.def.flying ? (2.4 + Math.sin(performance.now() * 0.006 + e.progress * 20) * 0.2) : 0;
      e.mesh.position.set(tmp.x, flyY, tmp.z);
      // face direction
      const lookT = Math.min(1, e.progress + 0.01);
      pathCurve.getPoint(lookT, tmp);
      e.mesh.lookAt(tmp.x, flyY, tmp.z);
      // billboard HP
      if (e.mesh.userData.hpBar) {
        e.mesh.userData.hpBar.quaternion.copy(camera.quaternion);
        e.mesh.children.forEach(c => {
          if (c !== e.mesh.userData.hpBar && c.geometry && c.geometry.type === 'PlaneGeometry') {
            c.quaternion.copy(camera.quaternion);
          }
        });
      }
    }
  }

  function updateTowers(dt) {
    for (const t of state.towers) {
      t.cooldown -= dt;
      if (t.cooldown > 0) continue;
      const target = findTarget(t);
      if (!target) continue;
      fireTower(t, target);
      t.cooldown = 1 / t.def.fireRate;
      // bob
      t.mesh.rotation.y += 0.4;
    }
  }

  function updateProjectiles(dt) {
    for (const p of state.projectiles) {
      if (!p.alive) continue;
      if (!p.target || !p.target.alive) {
        // find new or die
        const t = p.tower ? findTarget(p.tower) : null;
        if (!t) { destroyProj(p); continue; }
        p.target = t;
      }
      const dest = p.target.mesh.position.clone();
      dest.y += 0.5;
      const dir = dest.clone().sub(p.pos);
      const dist = dir.length();
      const step = p.speed * dt;
      if (dist <= step + 0.35) {
        p.pos.copy(dest);
        p.mesh.position.copy(dest);
        applyHit(p, p.target);
      } else {
        dir.normalize().multiplyScalar(step);
        p.pos.add(dir);
        p.mesh.position.copy(p.pos);
      }
    }
    state.projectiles = state.projectiles.filter(p => p.alive);
  }

  function updateEffects(dt) {
    for (const fx of state.effects) {
      fx.life -= dt;
      fx.tick += dt;
      if (fx.type === 'burn' && fx.tick >= 0.4) {
        fx.tick = 0;
        const r2 = fx.r * fx.r;
        for (const e of state.enemies) {
          if (!e.alive) continue;
          const dx = e.mesh.position.x - fx.pos.x;
          const dz = e.mesh.position.z - fx.pos.z;
          if (dx*dx + dz*dz <= r2) {
            e.statuses.burn = { t: 0.5, dps: fx.dps };
            damageEnemy(e, fx.dps * 0.4);
          }
        }
        if (fx.mesh.material) fx.mesh.material.opacity = 0.2 + 0.2 * Math.sin(performance.now() * 0.01);
      }
      if (fx.life <= 0) {
        scene.remove(fx.mesh);
        fx.dead = true;
      }
    }
    state.effects = state.effects.filter(f => !f.dead);

    for (const p of state.particlesFx) {
      p.life -= dt;
      p.vel.y -= 12 * dt;
      p.mesh.position.addScaledVector(p.vel, dt);
      p.mesh.material.opacity = Math.max(0, p.life * 2);
      if (p.life <= 0) { scene.remove(p.mesh); p.dead = true; }
    }
    state.particlesFx = state.particlesFx.filter(p => !p.dead);
  }

  function updateSpawns(dt) {
    if (!state.waveActive || state.spawnQueue.length === 0) return;
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0) {
      const next = state.spawnQueue.shift();
      spawnEnemy(next.type);
      if (state.spawnQueue.length) state.spawnTimer = state.spawnQueue[0].gap;
    }
  }

  // ambient particles drift
  function updateAmbient(dt) {
    const pos = particles.geometry.attributes.position;
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      let y = pos.getY(i) + dt * 0.8;
      if (y > 28) y = 2;
      pos.setY(i, y);
    }
    pos.needsUpdate = true;
  }

  // ===== Main loop =====
  function animate() {
    requestAnimationFrame(animate);
    const rawDt = Math.min(0.05, clock.getDelta());
    const dt = rawDt * (state.running && !state.gameOver ? state.speed : 0);
    controls.update();
    if (state.running && !state.gameOver) {
      updateSpawns(dt);
      updateEnemies(dt);
      updateTowers(dt);
      updateProjectiles(dt);
      updateEffects(dt);
      checkWaveEnd();
    }
    updateAmbient(rawDt);
    // idle spin towers slightly
    if (!state.running) {
      state.towers.forEach(t => { t.mesh.rotation.y += rawDt * 0.3; });
    }
    renderer.render(scene, camera);
  }

  // ===== UI wiring =====
  function resetGame() {
    // clear entities
    state.enemies.forEach(e => scene.remove(e.mesh));
    state.towers.forEach(t => scene.remove(t.mesh));
    state.projectiles.forEach(p => scene.remove(p.mesh));
    state.effects.forEach(f => scene.remove(f.mesh));
    state.particlesFx.forEach(p => scene.remove(p.mesh));
    state.enemies = [];
    state.towers = [];
    state.projectiles = [];
    state.effects = [];
    state.particlesFx = [];
    state.occupied.clear();
    state.money = START_MONEY;
    state.lives = START_LIVES;
    state.wave = 0;
    state.speed = 1;
    state.waveActive = false;
    state.spawnQueue = [];
    state.gameOver = false;
    state.won = false;
    state.selectedTower = null;
    clearTowerTypeSelection();
    upgradePanel.classList.remove('show');
    btnSpeed.innerHTML = '<i class="fas fa-forward"></i>';
    document.getElementById('winScreen').style.display = 'none';
    document.getElementById('loseScreen').style.display = 'none';
    updateHUD();
  }

  document.getElementById('btnStart').addEventListener('click', () => {
    document.getElementById('startScreen').style.display = 'none';
    resetGame();
    state.running = true;
  });
  document.getElementById('btnWinRestart').addEventListener('click', () => {
    document.getElementById('winScreen').style.display = 'none';
    resetGame();
    state.running = true;
  });
  document.getElementById('btnLoseRestart').addEventListener('click', () => {
    document.getElementById('loseScreen').style.display = 'none';
    resetGame();
    state.running = true;
  });
  btnStartWave.addEventListener('click', startNextWave);
  btnSpeed.addEventListener('click', () => {
    state.speed = state.speed === 1 ? 2 : 1;
    btnSpeed.innerHTML = state.speed === 2
      ? '<i class="fas fa-forward" style="color:#ffd54a"></i>'
      : '<i class="fas fa-forward"></i>';
    btnSpeed.title = state.speed === 2 ? '速度 2x' : '速度 1x';
  });
  document.getElementById('btnResetCam').addEventListener('click', () => {
    camera.position.set(0, 38, 48);
    controls.target.set(0, 0, 0);
    controls.update();
  });

  // keyboard
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); startNextWave(); }
    if (e.key === '1' || e.key === '2') {
      state.speed = e.key === '2' ? 2 : 1;
      btnSpeed.innerHTML = state.speed === 2
        ? '<i class="fas fa-forward" style="color:#ffd54a"></i>'
        : '<i class="fas fa-forward"></i>';
    }
    if (e.key === 'Escape') {
      clearTowerTypeSelection();
      state.selectedTower = null;
      upgradePanel.classList.remove('show');
    }
  });


  // ===== Class API (Tower, Enemy, Projectile, BurnZone, Game) =====
  class BurnZone {
    constructor(pos, radius, dps, duration) {
      this.pos = pos; this.radius = radius; this.dps = dps; this.life = duration; this.alive = true;
      createBurnZone(pos, { burnR: radius, burnDps: dps, burnDur: duration, color: 0xff5500 });
    }
  }
  class Projectile {
    constructor(origin, target, def) {
      this.origin = origin; this.target = target; this.def = def; this.alive = true;
    }
  }
  class Enemy {
    constructor(typeId) { spawnEnemy(typeId); this.ref = state.enemies[state.enemies.length - 1]; }
  }
  class Tower {
    constructor(def, position) {
      this.def = Object.assign({}, def);
      this.position = position;
      this.levelA = 0; this.levelB = 0; this.spentMoney = def.cost;
    }
    upgradeA() { /* damage branch */ }
    upgradeB() { /* rate+range branch */ }
    sellValue() { return Math.floor(this.spentMoney * 0.6); }
  }
  class Game {
    constructor() { this.state = state; }
    startWave() { startNextWave(); }
    get money() { return state.money; }
    get lives() { return state.lives; }
    get wave() { return state.wave; }
  }
  const game = new Game();
  // expose for debugging
  window.FruitTD = { Game, Tower, Enemy, Projectile, BurnZone, game, TOWER_DEFS, ENEMY_DEFS, WAVES, state };

  // init
  buildTowerBar();
  updateHUD();
  animate();

})();
</script>
